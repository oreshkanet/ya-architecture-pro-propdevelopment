apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-manager-binding
  namespace: default
roleRef:
  kind: ClusterRole
  name: ops-manager
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: ops-managers
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: user_ops_manager1
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: user_ops_manager2
    apiGroup: rbac.authorization.k8s.io