apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-manager
rules:
  # Чтение ресурсов
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "events", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Запрет чтения логов
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: []
  # Запрет выполнения exec
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-manager-binding
roleRef:
  kind: ClusterRole
  name: ops-manager
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: ops-managers
    apiGroup: rbac.authorization.k8s.io