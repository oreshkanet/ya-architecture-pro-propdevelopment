apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-engineer
rules:
  # Чтение ресурсов
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces", "events", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Выполнение exec только для диагностики
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Возможность перезапуска подов (только удаление, а контроллер создаст новый под)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-engineer-binding
roleRef:
  kind: ClusterRole
  name: ops-engineer
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: operations-team
    apiGroup: rbac.authorization.k8s.io