apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-auditor-binding
roleRef:
  kind: ClusterRole
  name: security-auditor
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: Group
    name: security-team
    namespace: kube-system
  - kind: User
    name: user_sec1
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: user_sec2
    apiGroup: rbac.authorization.k8s.io